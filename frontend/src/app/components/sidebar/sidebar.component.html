<aside class="sidebar">

  <!-- Header -->
  <div class="sidebar-header">
    <h2>Chats</h2>
  </div>

  <!-- New Chat -->
  <button
    id="newChatBtn"
    type="button"
    class="new-chat-btn"
    (click)="onNewChat()"
  >
    ＋ New Chat
  </button>

  <!-- Session List -->
  <div id="sessions" class="session-list">

    <!-- Loading -->
    <div
      *ngIf="loading"
      class="session-empty"
    >
      Loading…
    </div>

    <!-- No Chats -->
    <div
      *ngIf="!loading && sessions.length === 0"
      class="session-empty"
    >
      No chats yet
    </div>

    <!-- Sessions -->
    <div
      *ngFor="let session of sessions"
      class="session-item"
      [class.active]="session.id === currentSessionId"
    >

      <!-- Session Content -->
      <div
        class="session-content"
        (click)="selectSession(session.id)"
      >

        <span
          class="session-name"
          [title]="displayName(session)"
        >
          {{ displayName(session) }}
        </span>

      </div>

      <!-- Options -->
      <button
        type="button"
        class="session-menu-btn"
        title="Options"
        (click)="openMenu($event, session.id)"
      >
        ⋯
      </button>

    </div>

  </div>

  <!-- Chat Loading -->
  <div
    *ngIf="loadingChat"
    class="session-status"
  >
    Loading messages…
  </div>

  <!-- Chat Error -->
  <div
    *ngIf="chatError"
    class="session-status error"
  >
    {{ chatError }}
  </div>

  <!-- Context Menu -->
  <div
    *ngIf="menuVisible && menuSessionId"
    class="sidebar-context-menu"
    [style.left.px]="menuLeft"
    [style.top.px]="menuTop"
    (click)="$event.stopPropagation()"
  >

    <button
      type="button"
      (click)="startRename(getSessionById(menuSessionId))"
    >
      ✏️ Rename
    </button>

    <button
      type="button"
      class="delete-option"
      (click)="deleteSession(menuSessionId)"
    >
      🗑 Delete
    </button>

  </div>

</aside>
