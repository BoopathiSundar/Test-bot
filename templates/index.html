<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Syntax highlighting for code blocks -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

<div class="container">

    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <h2>Chats</h2>
        </div>

        <button id="newChatBtn" onclick="startNewChat()">＋ New Chat</button>

        <div id="sessions"></div>

        <div class="sidebar-footer">
            <button id="archivedBtn" onclick="toggleArchivedView()">🗄 Archived</button>
            <button id="clearBtn" onclick="clearChat()">🗑 Clear all chats</button>
        </div>

    </aside>

    <!-- Right Side -->
    <div class="main">

        <header class="chat-header">
            <button id="sidebarToggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">☰</button>
            <h2 id="chatTitle">New chat</h2>
        </header>

        <!-- Chat Messages -->
        <div class="chat-scroll">
            <div id="chatbox"></div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <div class="input-shell">
                <input
                    type="text"
                    id="message"
                    placeholder="Ask anything..."
                    autocomplete="off"
                    onkeydown="if(event.key==='Enter') sendMessage();"
                >
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>
        <div class="hint">&#8203;</div>

    </div>

</div>

<!-- Context menu -->
<div id="sessionMenu" class="session-menu">
    <button id="menuPinBtn" onclick="pinSelectedSession()">📌 Pin</button>
    <button id="menuArchiveBtn" onclick="archiveSelectedSession()">🗄 Archive</button>
    <button onclick="renameSelectedSession()">✏️ Rename</button>
    <button class="delete-option" onclick="deleteSelectedSession()">🗑 Delete</button>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
